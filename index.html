<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barangay Tinorongan Document Request System</title>
  <!-- Bootstrap 5 + Bootstrap Icons (loaded from CDN, needs internet) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

<!-- ================= LOGIN VIEW ================= -->
<div id="loginView" class="login-wrap">
  <div class="login-card">
    <img src="assets/logo.png" alt="Barangay Tinorongan logo" class="login-logo">
    <h1 class="brand-title">BARANGAY TINORONGAN</h1>
    <div class="brand-sub">Document Request System</div>
    <div class="mb-3"></div>

    <!-- Role selector -->
    <div class="role-switch mb-3">
      <button type="button" id="roleResident" class="active" onclick="setLoginRole('resident')"><i class="bi bi-person"></i> Resident</button>
      <button type="button" id="roleStaff" onclick="setLoginRole('staff')"><i class="bi bi-person-badge"></i> Staff / Registrar</button>
    </div>

    <form id="loginForm" class="text-start" onsubmit="doLogin(event)" novalidate>
      <label class="form-label">Email</label>
      <input type="email" id="email" class="form-control mb-2" required>
      <label class="form-label">Password</label>
      <input type="password" id="password" class="form-control mb-2" required>
      <div id="loginError" class="text-danger small mb-2" hidden></div>
      <button class="btn btn-brand w-100" type="submit">Login</button>
    </form>
    <div class="small text-muted mt-3">Demo: resident@gmail.com or staff@gmail.com — password 123456</div>
    <div class="small text-muted mt-1">Sagñay, Camarines Sur</div>
  </div>
</div>

<!-- ================= APP VIEW ================= -->
<div id="appView" hidden>
  <div id="overlay" class="overlay" onclick="toggleSide()"></div>
  <aside id="sidebar" class="sidebar"></aside>

  <div class="main">
    <header class="topbar">
      <button class="btn btn-light d-lg-none" onclick="toggleSide()" aria-label="Menu"><i class="bi bi-list fs-4"></i></button>
      <img src="assets/logo.png" alt="Logo" class="top-logo">
      <div class="me-auto">
        <div class="fw-bold lh-1 text-green">BARANGAY TINORONGAN</div>
        <small class="text-muted">Document Request System <span class="d-none d-md-inline">• Faster. Easier. More Accessible.</span></small>
      </div>
      <div class="user-chip"><i class="bi bi-person-circle"></i> <span id="userName"></span></div>
    </header>
    <main id="content" class="content"></main>
  </div>
</div>

<!-- Shared modal (details, processing, preview) -->
<div class="modal fade" id="mainModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="modalTitle"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast-msg"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
